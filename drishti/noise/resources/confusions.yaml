# Plausible witness mistakes. Extend as you collect real witness data in Phase 2.

# commission: a colour is confidently reported as one of these instead
color_confusions:
  red: [maroon, orange, pink]
  maroon: [red, brown, purple]
  black: [navy, grey, brown]
  navy: [black, blue]
  "navy blue": [black, blue]
  blue: [black, green, purple]
  "dark blue": [black, purple]
  "light blue": [white, grey, green]
  "sky blue": [white, grey]
  white: [grey, cream, beige]
  cream: [white, beige, yellow]
  "off white": [white, cream]
  grey: [white, black, silver]
  gray: [white, black, silver]
  green: [blue, olive, black]
  olive: [green, brown, khaki]
  yellow: [orange, golden, cream]
  golden: [yellow, orange]
  orange: [red, yellow, saffron]
  saffron: [orange, yellow]
  pink: [red, purple, peach]
  "rani pink": [red, purple, magenta]
  purple: [blue, pink, maroon]
  brown: [black, maroon, khaki]
  beige: [white, brown, cream]
  khaki: [brown, beige, olive]
  mustard: [yellow, orange]
  "haldi yellow": [yellow, orange]

# commission: a garment is confused with another in the same group
garment_groups:
  - [saree, lehenga, "half saree", sari]
  - [kurta, kurti, shirt, top]
  - [salwar, churidar, leggings, palazzo]
  - [dhoti, lungi, mundu]
  - [jeans, trousers, pants]
  - [shorts, skirt]
  - ["t-shirt", shirt, top]
  - [jacket, coat, sweater, hoodie, sweatshirt]
  - [backpack, bag, handbag, jhola]
  - [sandals, chappals, slippers]
  - [shoes, sneakers, boots]
  - [cap, hat]
  - [dupatta, stole, scarf, shawl]
  - [glasses, sunglasses]

