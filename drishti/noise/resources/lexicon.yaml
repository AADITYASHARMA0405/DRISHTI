# Vocabulary used to find attribute phrases in a description.
# Extend freely: add a word to the right list and the simulator picks it up (no code change needed).

colors: [black, white, grey, gray, red, blue, green, yellow, orange, pink, purple, brown, maroon, navy,
         beige, cream, violet, golden, gold, silver, khaki, olive, teal, cyan, magenta, crimson, turquoise,
         peach, saffron, mustard, tan, lavender, burgundy, indigo, multicolored, colorful, colourful]

# multi-word colours are matched before single words
multiword_colors: ["off white", "rani pink", "haldi yellow", "sky blue", "navy blue", "bottle green",
                   "olive green", "light blue", "dark blue", "light green", "dark green", "light pink",
                   "dark red", "light grey", "dark grey", "light gray", "dark gray", "light brown",
                   "dark brown"]

color_modifiers: [light, dark, bright, pale, deep]

patterns: [striped, stripes, checked, checkered, plaid, printed, floral, plain, dotted, polka,
           embroidered, zari, bandhani, patterned, graphic, logo]

# material / style words that sit between a colour and its garment ("black down jacket", "brown leather
# shoes"). They belong to the attribute but the error operators leave them unchanged.
style_modifiers: [down, down-filled, leather, cotton, cotton-padded, padded, woolen, wool, woollen, knitted,
                  denim, canvas, suede, fur, silk, nylon, sports, sport, running, casual, formal, hooded,
                  long, short, long-sleeved, short-sleeved, sleeveless, high-heeled, flat, thick, thin, loose,
                  tight, slim, big, small, large, plastic, paper, shoulder, school, single, double, cross-body,
                  waist, ankle, knee-length, full-length, baseball, sun, peaked, rain, face, medical, surgical,
                  traditional, ethnic, silk]

# garment -> category and salience.
# salient: large / central items witnesses usually remember; peripheral: small items they often forget.
garments:
  # full body
  saree: {category: full, salient: true}
  sari: {category: full, salient: true}
  "salwar kameez": {category: full, salient: true}
